manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # LVGL v9 port of mctechnology17/zmk-nice-oled (nice!view screens via nice_epaper)
    - name: osoc
      url-base: https://gitlab.com/open-source-open-colab
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-nice-oled
      remote: osoc
      revision: v0.1.3
    # Required by zmk-nice-oled: without it the screen redraws every display
    # tick forever, starving key handling on the central half.
    - name: zmk-intelli-keypress-events
      remote: osoc
      revision: v0.0.1
  self:
    path: config
